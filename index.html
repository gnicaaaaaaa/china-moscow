    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 78% 15%, rgba(255, 230, 206, .28), transparent 34%),
        linear-gradient(180deg, rgba(33, 50, 45, .04), rgba(19, 37, 35, .18));
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(980px, calc(100% - 80px));
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 0 max(20px, env(safe-area-inset-bottom));
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .times {
      width: min(520px, 100%);
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .time-card,
    .main-card,
    .route-card {
      border: 1px solid rgba(255, 255, 255, .58);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(7px) saturate(.94);
      -webkit-backdrop-filter: blur(7px) saturate(.94);
    }

    .time-card {
      min-height: 88px;
      padding: 13px 20px;
      border-radius: 19px;
      display: grid;
      align-content: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: #455149;
      font-size: .7rem;
      font-weight: 650;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .clock {
      margin-top: 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 3.2vw, 2.45rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.035em;
    }

    .local-date {
      margin-top: 6px;
      color: var(--muted);
      font-size: .7rem;
      text-transform: lowercase;
    }

    .main-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      display: grid;
      grid-template-columns: .92fr 1.08fr;
    }

    .main-card::before {
      content: "归来";
      position: absolute;
      top: 18px;
      right: 20px;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(168, 76, 62, .52);
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: rgba(168, 76, 62, .7);
      font-family: serif;
      font-size: 1.08rem;
      line-height: 1;
      writing-mode: vertical-rl;
      letter-spacing: -.08em;
      transform: rotate(-2deg);
    }

    .countdown,
    .quote-wrap {
      min-width: 0;
      padding: clamp(28px, 4vw, 46px);
    }

    .countdown {
      position: relative;
      border-right: 1px solid var(--line);
    }

    .days-number {
      margin: 14px 0 0;
      color: var(--red);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(6.4rem, 11vw, 9.4rem);
      font-weight: 400;
      line-height: .76;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }

    .days-label {
      margin: 18px 0 0;
      font-size: clamp(1rem, 1.7vw, 1.3rem);
      font-weight: 620;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .passed {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: #59655e;
      font-size: .78rem;
      font-weight: 620;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .quote-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: clamp(60px, 6.5vw, 76px);
      background: radial-gradient(circle at 74% 45%, rgba(242, 183, 152, .13), transparent 44%);
    }

    .quote {
      max-width: 560px;
      min-height: 4.3em;
      margin: 16px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 2.6vw, 2.35rem);
      line-height: 1.18;
      letter-spacing: -.025em;
      text-wrap: balance;
      transition: opacity .3s ease, transform .3s ease;
    }

    .quote-date {
      margin-top: 18px;
      color: var(--red);
      font-size: .8rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .route-card {
      padding: 19px 28px 15px;
      border-radius: 23px;
    }

    .route-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
    }

    .route-title {
      margin: 0;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .route-stats {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .08em;
      text-align: right;
    }

    .route {
      --progress: 0%;
      position: relative;
      height: 58px;
      margin-inline: 34px;
    }

    .route-track,
    .route-fill {
      position: absolute;
      top: 14px;
      left: 0;
      height: 2px;
      border-radius: 999px;
    }

    .route-track {
      width: 100%;
      background-image: repeating-linear-gradient(90deg, rgba(42, 58, 51, .32) 0 6px, transparent 6px 12px);
    }

    .route-fill {
      width: var(--progress);
      background: linear-gradient(90deg, #8f443b, var(--red-soft));
      box-shadow: 0 0 12px rgba(168, 76, 62, .32);
      transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
    }

    .place {
      position: absolute;
      top: 6px;
      z-index: 2;
      width: 86px;
      display: grid;
      justify-items: center;
      gap: 8px;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .place::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 3px solid var(--paper-strong);
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 1px var(--red);
    }

    .place.start { left: 0; transform: translateX(-50%); }
    .place.end { left: 100%; transform: translateX(-50%); }

    .plane {
      position: absolute;
      z-index: 3;
      top: -7px;
      left: var(--progress);
      width: 42px;
      height: 42px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      color: var(--red);
      filter: drop-shadow(0 6px 8px rgba(62, 48, 42, .22));
      transition: left 1.1s cubic-bezier(.2, .8, .2, 1);
      animation: fly 3.2s ease-in-out infinite;
    }

    .plane svg {
      width: 38px;
      height: 38px;
      overflow: visible;
    }

    @keyframes fly {
      0%, 100% { translate: 0 0; rotate: -1deg; }
      50% { translate: 0 -3px; rotate: 1deg; }
    }

    .footer-note {
      margin: 0;
      color: rgba(255, 252, 247, .96);
      text-align: center;
      text-shadow: 0 2px 12px rgba(18, 38, 36, .62);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .9rem;
      letter-spacing: .08em;
    }

    .heart {
      display: inline-block;
      margin-left: .3em;
      color: #c75d50;
      font-size: 1.2em;
      text-shadow: 0 2px 10px rgba(115, 35, 27, .42);
      transform: rotate(-8deg);
    }

    .heart-burst {
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      pointer-events: none;
      user-select: none;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1;
      transform: translate(-50%, -50%) scale(.25);
      filter: drop-shadow(0 4px 6px rgba(99, 31, 25, .18));
      animation: heart-firework 1050ms cubic-bezier(.15, .7, .25, 1) forwards;
      animation-delay: var(--delay, 0ms);
      will-change: transform, opacity;
    }

    @keyframes heart-firework {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2) rotate(0deg);
      }
      12% { opacity: var(--alpha, .7); }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
          scale(var(--scale, 1))
          rotate(var(--rotation, 0deg));
      }
    }

      body::before {
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 225, 202, .13), transparent 34%),
          linear-gradient(180deg, rgba(255, 236, 219, .02), rgba(117, 84, 74, .06));
      }

      .page {
        width: min(calc(100% - 40px), 480px);
        height: 100vh;
        height: 100svh;
        min-height: 0;
        padding: max(10px, env(safe-area-inset-top)) 0 max(9px, env(safe-area-inset-bottom));
        align-content: center;
        grid-template-rows: auto auto auto auto;
        gap: 8px;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .page::-webkit-scrollbar { display: none; }

      .times { gap: 8px; }

      .time-card {
        min-height: 70px;
        padding: 8px 7px;
        border-radius: 15px;
      }

      .eyebrow { font-size: .58rem; letter-spacing: .1em; }
      .clock { margin-top: 4px; font-size: clamp(1.5rem, 7.5vw, 2rem); }
      .local-date { display: none; }

      .main-card {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        min-height: 0;
        border-radius: 22px;
      }

      .main-card::before {
        top: 13px;
        right: 14px;
        width: 32px;
        height: 32px;
        font-size: .88rem;
      }

      .countdown,
      .quote-wrap {
        min-height: 0;
        overflow: hidden;
        padding: 16px 18px;
      }

      .countdown {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      .countdown .eyebrow { padding-right: 34px; }
      .days-number { margin-top: 11px; font-size: clamp(5.4rem, 29vw, 7.2rem); }
      .days-label { margin-top: 12px; font-size: .82rem; letter-spacing: .12em; }
      .passed { margin-top: 12px; padding-top: 9px; font-size: .64rem; letter-spacing: .1em; }

      .quote-wrap {
        text-align: center;
        align-items: center;
      }

      .quote { min-height: 0; margin-top: 10px; font-size: clamp(1.18rem, 5.5vw, 1.55rem); line-height: 1.12; }
      .quote-date { margin-top: 10px; font-size: .62rem; }

      .route-card { padding: 12px 15px 9px; border-radius: 18px; }
      .route-head { align-items: center; margin-bottom: 5px; }
      .route-title { font-size: .62rem; letter-spacing: .1em; }
      .route-stats { max-width: 138px; font-size: .62rem; }
      .route { height: 48px; margin-inline: 28px; }
      .place { font-size: .62rem; letter-spacing: .1em; }
      .plane { width: 36px; height: 36px; top: -4px; }
      .plane svg { width: 31px; height: 31px; }
      .footer-note { padding: 0; font-size: .78rem; }
    }

    @media (max-width: 380px) {
      .page { width: calc(100% - 32px); }
      .time-card { min-height: 64px; padding-inline: 5px; }
      .eyebrow { font-size: .54rem; }
      .clock { font-size: 1.42rem; }
      .days-number { font-size: 5rem; }
      .quote { font-size: 1.08rem; }
      .route-card { padding-inline: 11px; }
      .route-stats { max-width: 118px; font-size: .56rem; }
    }

    @media (max-width: 760px) and (max-height: 650px) {
      .page { padding-top: max(6px, env(safe-area-inset-top)); gap: 6px; }
      .time-card { min-height: 58px; }
      .main-card::before { display: none; }
      .countdown, .quote-wrap { padding-block: 11px; }
      .countdown .eyebrow { padding-right: 0; }
      .days-number { margin-top: 7px; font-size: 4.65rem; }
      .days-label { margin-top: 8px; }
      .passed { margin-top: 8px; padding-top: 7px; }
      .quote { margin-top: 7px; font-size: 1.05rem; }
      .quote-date { margin-top: 7px; }
      .route-card { padding-block: 8px 5px; }
      .route { height: 44px; }
      .footer-note { font-size: .7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <main class="page">
    <section class="times" aria-label="Время в Пекине и Москве">

        <time class="clock" id="beijing-time">--:--:--</time>
        <div class="local-date" id="beijing-date">загрузка даты</div>
      </article>
      <article class="time-card">
        <p class="eyebrow">У меня · Москва</p>
        <time class="clock" id="moscow-time">--:--:--</time>
        <div class="local-date" id="moscow-date">загрузка даты</div>

    <section class="main-card" aria-label="Счётчик до встречи">
      <div class="countdown">
        <p class="eyebrow" id="countdown-heading">До нашей встречи</p>

        <div class="days-label" id="days-label">дней осталось</div>

      <div class="quote-wrap">

        <div class="quote-date" id="quote-date"></div>
      </div>
    </section>

    <section class="route-card" aria-label="Путь из Пекина в Москву">

        <h2 class="route-title">Пекин → Москва</h2>

        <div class="place end">Москва</div>
      </div>
    </section>

    <p class="footer-note">Возвращайся, я жду <span class="heart">♥</span></p>
  </main>

  <script>
    (() => {
      "use strict";

      const TRIP_START = new Date("2026-09-07T00:00:00+03:00");
      // Конец 24 января: встреча считается наступившей в 00:00 25 января по Москве.
      const TRIP_END = new Date("2027-01-25T00:00:00+03:00");
      const DAY = 86_400_000;

      const quotes = [
        "Ты далеко, но всё равно рядом со мной.",
        "Ещё один день — и мы стали немного ближе.",
        "Пусть сегодня у тебя всё получится. Я в тебя верю.",
        "Расстояние временное. Мы — нет.",
        "Береги себя там, зая. Здесь тебя очень ждут.",
        "Пусть этот день будет к тебе добрым.",
        "Я горжусь тобой и всем, что ты сейчас делаешь.",
        "Сегодня можно не спешить. Просто сделай столько, сколько сможешь.",
        "Один обычный день тоже ведёт тебя домой.",
        "У нас впереди ещё много совместных завтраков.",
        "Даже через тысячи километров ты остаёшься моим близким человеком.",
        "Пусть сегодня найдётся хотя бы один повод улыбнуться.",
        "Ты справляешься лучше, чем тебе иногда кажется.",
        "Когда скучаю, напоминаю себе: эта разлука не навсегда.",
        "Скоро вместо сообщений будут настоящие объятия.",
        "Денис, дома тебя ждёт твоё солнышко.",
        "Необязательно быть продуктивным каждый день. Иногда достаточно просто прожить его.",
        "Пусть сегодняшний день будет спокойным и лёгким.",
        "Я мысленно рядом — даже когда у нас разное время на часах.",
        "Каждое утро — ещё один маленький шаг навстречу.",
        "Скучать по тебе грустно, но любить тебя — очень хорошо.",
        "Пусть Китай подарит тебе хорошие истории, которые ты расскажешь дома.",
        "Я верю в тебя. Без громких слов — просто всегда.",
        "У расстояния есть дата окончания.",
        "Самое важное уже решено: мы обязательно увидимся.",
        "Зая, пусть сегодня всё сложится удачно.",
        "Ты можешь устать. Это не значит, что ты не справляешься.",
        "Пусть день пройдёт быстро, а вечер будет уютным.",
        "Сегодня я снова выбираю ждать тебя с любовью, а не с грустью.",
        "Между Пекином и Москвой много километров, но ни одного навсегда.",
        "Ещё один закат позади — значит, встреча ближе.",
        "Вероника-солнышко передаёт: ты очень важен.",
        "Пусть рядом окажутся хорошие люди и вкусная еда.",
        "Тебе не нужно быть сильным каждую минуту.",
        "Я храню для тебя место рядом — оно никуда не денется.",
        "Всё большое складывается из маленьких дней. Этот — тоже важный.",
        "Пусть сегодня будет больше любопытства, чем тревоги.",
        "Я жду не идеального возвращения. Я просто жду тебя.",
        "Наш самолёт уже мысленно взял курс на Москву.",
        "Если сегодня непросто — помни, что дома тебя любят.",
        "Пусть сегодняшний день оставит после себя что-то хорошее.",
        "Мы умеем быть рядом даже на расстоянии.",
        "У тебя всё получится — по шагу, без спешки.",
        "Ещё немного терпения, и этот маршрут станет воспоминанием.",
        "Скоро время на наших часах снова будет одним и тем же.",
        "Зая, не забывай отдыхать. Подвиги подождут.",
        "Твоё солнышко сегодня особенно по тебе скучает.",
        "Этот день не нужно торопить — он и сам приблизит встречу.",
        "Любовь не отменяет расстояние, но делает его переносимым.",
        "Пусть путь домой будет лёгким, а ожидание — недолгим.",
        "Сегодняшняя задача простая: беречь себя.",
        "Я рада, что именно тебя мне так хочется ждать.",
        "Однажды мы вспомним эти месяцы и удивимся, как быстро они прошли.",
        "Пока самолёт движется по линии, мы движемся навстречу.",
        "Пусть сегодня тебе встретится что-нибудь красивое.",
        "Ты мой человек — независимо от часового пояса.",
        "Не считай километры. Смотри, сколько дней уже позади.",
        "В Пекине уже другой час, а моя забота о тебе — всё та же.",
        "Я рядом настолько, насколько это сейчас возможно.",
        "Возвращайся с историями. Я приготовлю объятия.",
        "Пусть этот день будет ещё одной тихой победой.",
        "Совсем не обязательно не скучать. Главное — помнить, ради чего ждём.",
        "Там — новые впечатления. Здесь — человек, который тебя любит.",
        "Пусть сегодня будет легко на сердце.",
        "Наше «скоро» с каждым днём становится всё ближе.",
        "Зая, всё хорошо: день прошёл, встреча приблизилась.",
        "Я посылаю тебе немного московского тепла.",
        "Расстояние учит особенно ценить простое «ты рядом».",
        "Скоро этот счётчик станет равен нулю.",
        "Пусть дорога ведёт тебя к хорошему — и обязательно домой."
      ];

      const $ = (id) => document.getElementById(id);
      const pad = (n) => String(n).padStart(2, "0");

      const clockFormatter = (timeZone) => new Intl.DateTimeFormat("ru-RU", {
        timeZone,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const dateFormatter = (timeZone, options = {}) => new Intl.DateTimeFormat("ru-RU", {
        timeZone,
        day: "numeric",
        month: "long",
        weekday: "short",
        ...options
      });

      const beijingClock = clockFormatter("Asia/Shanghai");
      const moscowClock = clockFormatter("Europe/Moscow");
      const beijingDate = dateFormatter("Asia/Shanghai");
      const moscowDate = dateFormatter("Europe/Moscow");
      const quoteDate = new Intl.DateTimeFormat("ru-RU", {
        timeZone: "Europe/Moscow",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

      function plural(number, one, few, many) {
        const mod10 = Math.abs(number) % 10;
        const mod100 = Math.abs(number) % 100;
        if (mod10 === 1 && mod100 !== 11) return one;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
        return many;
      }

      function moscowDayNumber(date) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Moscow",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date).reduce((acc, part) => {
          if (part.type !== "literal") acc[part.type] = Number(part.value);
          return acc;
        }, {});
        return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / DAY);
      }

      function updateClocks() {
        const now = new Date();
        $("beijing-time").textContent = beijingClock.format(now);
        $("moscow-time").textContent = moscowClock.format(now);
        $("beijing-date").textContent = beijingDate.format(now);
        $("moscow-date").textContent = moscowDate.format(now);
      }

      function updateQuote(now = new Date()) {
        const index = ((moscowDayNumber(now) % quotes.length) + quotes.length) % quotes.length;
        $("daily-quote").textContent = quotes[index];
        $("quote-date").textContent = quoteDate.format(now);
      }

      function updateCountdown() {
        const now = new Date();
        const totalDays = Math.round((TRIP_END - TRIP_START) / DAY);
        let passedDays;
        let leftDays;
        let progress;

        if (now < TRIP_START) {
          passedDays = 0;
          leftDays = totalDays;
          progress = 0;
          $("countdown-heading").textContent = "До начала пути";
        } else if (now >= TRIP_END) {
          passedDays = totalDays;
          leftDays = 0;
          progress = 100;
          $("countdown-heading").textContent = "Денис уже дома";
        } else {
          passedDays = Math.floor((now - TRIP_START) / DAY);
          leftDays = Math.ceil((TRIP_END - now) / DAY);
          progress = ((now - TRIP_START) / (TRIP_END - TRIP_START)) * 100;
          $("countdown-heading").textContent = "До нашей встречи";
        }

        $("days-left").textContent = leftDays;
        $("days-label").textContent = plural(leftDays, "день остался", "дня осталось", "дней осталось");
        $("days-passed").textContent = `${passedDays} ${plural(passedDays, "день уже позади", "дня уже позади", "дней уже позади")}`;
        $("route-stats").textContent = `${passedDays} из ${totalDays} ${plural(totalDays, "дня", "дней", "дней")} пути пройдено`;

        const safeProgress = Math.min(100, Math.max(0, progress));
        $("route").style.setProperty("--progress", `${safeProgress}%`);

        if (now >= TRIP_END) {
          $("daily-quote").textContent = "Вы снова рядом. Самая хорошая часть пути началась.";
          $("quote-date").textContent = "24 января 2027";
        }
      }

      function createHeartFirework(x, y) {
        const colors = [
          "rgba(145, 48, 42, .74)",
          "rgba(174, 66, 55, .68)",
          "rgba(204, 91, 75, .62)",
          "rgba(227, 126, 106, .56)"
        ];
        const count = window.matchMedia("(max-width: 760px)").matches ? 12 : 16;

        for (let i = 0; i < count; i += 1) {
          const heart = document.createElement("span");
          const angle = (Math.PI * 2 * i) / count + (Math.random() - .5) * .32;
          const distance = 48 + Math.random() * 92;
          const size = 12 + Math.random() * 18;

          heart.className = "heart-burst";
          heart.textContent = "♥";
          heart.style.left = `${x}px`;
          heart.style.top = `${y}px`;
          heart.style.fontSize = `${size}px`;
          heart.style.color = colors[Math.floor(Math.random() * colors.length)];
          heart.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          heart.style.setProperty("--dy", `${Math.sin(angle) * distance - 18}px`);
          heart.style.setProperty("--rotation", `${-45 + Math.random() * 90}deg`);
          heart.style.setProperty("--scale", `${.7 + Math.random() * .75}`);
          heart.style.setProperty("--alpha", `${.52 + Math.random() * .28}`);
          heart.style.setProperty("--delay", `${Math.random() * 90}ms`);
          document.body.appendChild(heart);
          heart.addEventListener("animationend", () => heart.remove(), { once: true });
          setTimeout(() => heart.remove(), 1400);
        }
      }

      document.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        createHeartFirework(event.clientX, event.clientY);
      }, { passive: true });

      updateClocks();
      updateQuote();
      updateCountdown();
      setInterval(updateClocks, 1000);
      setInterval(() => {
        updateQuote();
        updateCountdown();
      }, 60_000);
    })();
  </script>
</body>
